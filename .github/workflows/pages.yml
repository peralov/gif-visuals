name: Deploy GitHub Pages

on:
  push:
    branches: [gif-visuals-nodejs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build:pages

      - name: Verify pages artifact
        run: |
          echo "=== Hypothesis A: index.html at artifact root ==="
          test -f dist/index.html && echo "PASS: dist/index.html exists" || (echo "FAIL: missing dist/index.html" && exit 1)
          echo "=== Hypothesis B: no node_modules in dist ==="
          test ! -d dist/node_modules && echo "PASS: dist has no node_modules" || (echo "FAIL: node_modules in dist" && exit 1)
          echo "=== Hypothesis C: .nojekyll present ==="
          test -f dist/.nojekyll && echo "PASS: dist/.nojekyll exists" || (echo "FAIL: missing dist/.nojekyll" && exit 1)
          echo "=== Hypothesis E: static assets copied ==="
          test -d dist/client && echo "PASS: dist/client exists" || (echo "FAIL: missing dist/client" && exit 1)
          test -d dist/css && echo "PASS: dist/css exists" || (echo "FAIL: missing dist/css" && exit 1)
          echo "=== Artifact inventory ==="
          find dist -type f | wc -l
          du -sh dist

      - name: Publish dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Post-deploy verification
        run: |
          echo "=== Hypothesis F: gh-pages branch is clean after publish ==="
          git fetch origin gh-pages
          git ls-tree -r origin/gh-pages --name-only | tee /tmp/gh-pages-files.txt
          echo "file count: $(wc -l < /tmp/gh-pages-files.txt)"
          grep -q node_modules /tmp/gh-pages-files.txt && echo "FAIL: node_modules on gh-pages" && exit 1 || echo "PASS: no node_modules on gh-pages"
          grep -q '^index.html$' /tmp/gh-pages-files.txt && echo "PASS: index.html at gh-pages root" || (echo "FAIL: index.html missing" && exit 1)
