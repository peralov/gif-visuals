name: Deploy GitHub Pages

on:
  push:
    branches: [gif-visuals-nodejs]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run build:pages

      - name: Verify pages artifact
        run: |
          echo "=== Hypothesis A: index.html at artifact root ==="
          test -f dist/index.html && echo "PASS: dist/index.html exists" || (echo "FAIL: missing dist/index.html" && exit 1)
          echo "=== Hypothesis B: no node_modules in dist ==="
          test ! -d dist/node_modules && echo "PASS: dist has no node_modules" || (echo "FAIL: node_modules in dist" && exit 1)
          echo "=== Hypothesis C: .nojekyll present ==="
          test -f dist/.nojekyll && echo "PASS: dist/.nojekyll exists" || (echo "FAIL: missing dist/.nojekyll" && exit 1)
          echo "=== Hypothesis E: static assets copied ==="
          test -d dist/client && echo "PASS: dist/client exists" || (echo "FAIL: missing dist/client" && exit 1)
          test -d dist/css && echo "PASS: dist/css exists" || (echo "FAIL: missing dist/css" && exit 1)
          echo "=== Artifact inventory ==="
          find dist -type f | wc -l
          du -sh dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publish dist to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry deploy after wait
        if: steps.deployment.outcome == 'failure'
        run: sleep 90

      - name: Deploy to GitHub Pages (retry)
        if: steps.deployment.outcome == 'failure'
        id: deployment_retry
        uses: actions/deploy-pages@v4

      - name: Fail if all deploy attempts failed
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: exit 1
